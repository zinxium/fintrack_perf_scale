version: 2

exposures:
  - name: dashboard_powerbi_tenant_overview
    label: "Power BI — Tenant Overview"
    type: dashboard
    maturity: high
    url: https://app.powerbi.com/groups/xxx/reports/yyy
    description: |
      Dashboard exécutif Power BI consommé par les responsables tenants.
      Rafraîchi quotidiennement via l'API Power BI depuis Snowflake.
    depends_on:
      - ref('vw_transactions_summary')
      - ref('mart_tenant_kpis_daily')
      - ref('dim_tenants')
    owner:
      name: BI Team
      email: bi@fintrack.example

  - name: dashboard_powerbi_compliance
    label: "Power BI — Compliance Monitoring"
    type: dashboard
    maturity: high
    description: "Suivi AML/Fraud pour équipe compliance"
    depends_on:
      - ref('fct_transactions')
      - ref('mart_reconciliation')
    owner:
      name: Compliance Team
      email: compliance@fintrack.example

  - name: reverse_etl_hightouch_crm
    label: "Hightouch → HubSpot CRM"
    type: application
    maturity: medium
    description: |
      Sync quotidien des segments clients vers HubSpot.
      Utilise change tracking pour n'envoyer que les deltas.
    depends_on:
      - ref('dim_comptes')
      - ref('mart_tenant_kpis_daily')
    owner:
      name: Growth Team
      email: growth@fintrack.example

  - name: metabase_operations
    label: "Metabase — Ops Dashboard"
    type: dashboard
    maturity: medium
    depends_on:
      - ref('mart_reconciliation')
      - ref('vw_transactions_summary')
    owner:
      name: Operations
      email: ops@fintrack.example
