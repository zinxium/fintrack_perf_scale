version: 2

models:
  - name: fct_transactions
    tests:
      - elementary.volume_anomalies:
          timestamp_column: date_transaction
          time_bucket: {period: day, count: 1}
          days_back: 30
          anomaly_sensitivity: 3
          tags: [anomaly, critical]

      - elementary.freshness_anomalies:
          timestamp_column: _loaded_at
          time_bucket: {period: hour, count: 1}
          tags: [freshness]

    columns:
      - name: montant_eur
        tests:
          - elementary.column_anomalies:
              column_anomalies:
                - null_count
                - null_percent
                - min
                - max
                - average
              tags: [anomaly]

      - name: tenant_id
        tests:
          - elementary.dimension_anomalies:
              dimensions: [tenant_id]
              tags: [anomaly]

  - name: mart_tenant_kpis_daily
    tests:
      - elementary.event_freshness_anomalies:
          event_timestamp_column: jour
          tags: [freshness]
