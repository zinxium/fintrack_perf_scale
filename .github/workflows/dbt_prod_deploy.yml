name: dbt Production Deploy (Blue/Green)

on:
  push:
    branches: [main]
    paths:
      - 'dbt/**'

  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Force full refresh'
        type: boolean
        default: false

concurrency:
  group: dbt-prod-deploy
  cancel-in-progress: false

env:
  DBT_PROFILES_DIR: ./dbt
  SNOWFLAKE_ACCOUNT:          ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_PROD_USER:        ${{ secrets.SNOWFLAKE_PROD_USER }}
  SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/rsa_key.p8

jobs:
  deploy-blue:
    name: Deploy on BLUE schema
    runs-on: ubuntu-latest
    outputs:
      build_status: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install dbt-snowflake==1.12.*

      - name: Setup private key
        run: |
          echo "${{ secrets.SNOWFLAKE_PROD_PRIVATE_KEY }}" > /tmp/rsa_key.p8
          chmod 600 /tmp/rsa_key.p8

      - name: dbt build on BLUE
        id: build
        working-directory: ./dbt
        env:
          DBT_SCHEMA_SUFFIX: '_BLUE'
        run: |
          dbt deps
          dbt build --target prod ${{ inputs.full_refresh == true && '--full-refresh' || '' }}

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: manifest-blue
          path: dbt/target/manifest.json

  smoke-test:
    name: Smoke test on BLUE
    needs: deploy-blue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install snowflake-connector-python pytest
      - name: Run integration tests
        env:
          SNOWFLAKE_SCHEMA_SUFFIX: '_BLUE'
        run: pytest tests/integration/ -v

  swap:
    name: Swap BLUE → PROD
    needs: [deploy-blue, smoke-test]
    runs-on: ubuntu-latest
    if: needs.deploy-blue.outputs.build_status == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Setup SnowSQL
        run: |
          curl -o snowsql.bash https://sfc-repo.snowflakecomputing.com/snowsql/bootstrap/1.2/linux_x86_64/snowsql-1.2.30-linux_x86_64.bash
          bash snowsql.bash -y

      - name: Execute swap
        env:
          SNOWSQL_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWSQL_USER:    ${{ secrets.SNOWFLAKE_PROD_USER }}
          SNOWSQL_PWD:     ${{ secrets.SNOWFLAKE_PROD_PASSWORD }}
        run: |
          snowsql -q "
            ALTER SCHEMA FINTRACK_PROD.MARTS_CORE          SWAP WITH FINTRACK_PROD.MARTS_CORE_BLUE;
            ALTER SCHEMA FINTRACK_PROD.MARTS_FINANCE       SWAP WITH FINTRACK_PROD.MARTS_FINANCE_BLUE;
            ALTER SCHEMA FINTRACK_PROD.MARTS_ANALYTICS     SWAP WITH FINTRACK_PROD.MARTS_ANALYTICS_BLUE;
          "

      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {"text": "✅ dbt PROD deploy succeeded — commit ${{ github.sha }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
